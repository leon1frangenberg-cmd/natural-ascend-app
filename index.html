<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#fffbf5" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="default" />
<meta name="apple-mobile-web-app-title" content="Natural Ascend" />
<title>Natural Ascend · Jacked German</title>
<link rel="stylesheet" href="fonts-outfit.css" />
<link rel="stylesheet" href="fonts-newsreader.css" />
<link rel="stylesheet" href="fonts-newsreader-italic.css" />
<style>






* { box-sizing: border-box; margin: 0; padding: 0; }
html, body {
  background: #f4f1eb;
  font-family: Outfit, Inter, -apple-system, sans-serif;
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
}
body { min-height: 100vh; display: flex; flex-direction: column; align-items: center; padding: 28px 16px 48px; }

.phone-wrap { display: inline-block; margin: 0 0 72px 0; position: relative; padding: 36px; }

.phone {
  position: relative;
  width: 414px;
  height: 868px;
  background: linear-gradient(160deg, #f2f0ec 0%, #cfcbc4 16%, #8f8c87 48%, #d8d4ce 100%);
  border-radius: 62px;
  padding: 12px;
  box-shadow:
    inset 0 0 0 1.4px rgba(255,255,255,0.7),
    inset 0 0 0 3px #2a2a28,
    inset 0 0 0 4.5px #111,
    0 28px 60px rgba(40,36,30,0.22);
}
.phone-btn { position: absolute; background: linear-gradient(90deg, #bbb8b2, #8a8782 40%, #d0cdc8); z-index: 2; }
.btn-silent { left: -3px; top: 148px; width: 3px; height: 28px; border-radius: 2px 0 0 2px; }
.btn-vol-up { left: -3px; top: 198px; width: 3px; height: 52px; border-radius: 2px 0 0 2px; }
.btn-vol-down { left: -3px; top: 258px; width: 3px; height: 52px; border-radius: 2px 0 0 2px; }
.btn-power { right: -3px; top: 220px; width: 3px; height: 82px; border-radius: 0 2px 2px 0; }

.screen {
  width: 390px;
  height: 844px;
  border-radius: 50px;
  overflow: hidden;
  position: relative;
  color: #1c160e;
  background: #fffbf5;
}

.dynamic-island {
  position: absolute;
  top: 11px; left: 50%;
  transform: translateX(-50%);
  width: 124px; height: 36px;
  background: #000;
  border-radius: 20px;
  z-index: 40;
  box-shadow: 0 0 0 2px #000;
}
.dynamic-island .cam {
  position: absolute;
  right: 18px; top: 50%;
  transform: translateY(-50%);
  width: 12px; height: 12px;
  border-radius: 50%;
  background: #0b1520;
  box-shadow: inset 0 0 0 2px #0e1a28, inset 3px 2px 3px #1a3a5a;
}

.status-bar {
  position: absolute;
  top: 0; left: 0; right: 0;
  height: 54px;
  z-index: 30;
  display: flex;
  align-items: flex-end;
  justify-content: space-between;
  padding: 0 28px 8px 28px;
  pointer-events: none;
  color: #1c160e;
}
.sb-time {
  font-size: 16px;
  font-weight: 600;
  letter-spacing: -0.3px;
  width: 50px;
  font-family: Inter, sans-serif;
}
.sb-icons { display: flex; align-items: center; gap: 6px; }
.sb-icons svg { display: block; }

.app {
  height: 844px;
  display: flex;
  flex-direction: column;
  padding-top: 54px;
  position: relative;
  background: #fffbf5;
  color: #1c160e;
  --ink: #1c160e;
  --muted: #8a8580;
  font-family: Outfit, Inter, sans-serif;
}

.icon-btn {
  width: 32px; height: 32px;
  display: flex; align-items: center; justify-content: center;
  flex-shrink: 0;
  color: inherit;
}
.icon-btn.right { width: 28px; }
.header-actions { display: flex; align-items: center; gap: 2px; flex-shrink: 0; }
.actions-left { flex-shrink: 0; }

.header {
  height: 66px;
  display: flex;
  align-items: center;
  padding: 2px 10px 0;
  flex-shrink: 0;
  background: #fffbf5;
}
.header .wm {
  flex: 1;
  height: 36px;
  background: url(var(--img-wordmark-black-tight-png)) left center / contain no-repeat;
  margin-left: 4px;
}

.tabs {
  height: 40px;
  display: flex;
  align-items: stretch;
  padding: 0 8px;
  flex-shrink: 0;
  position: relative;
  z-index: 2;
  background: #fffbf5;
  border-bottom: 1px solid #e8e4de;
}
.tab {
  flex: 1;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 13.5px;
  font-weight: 550;
  color: var(--muted, #8a8580);
  position: relative;
  letter-spacing: -0.15px;
  font-family: Outfit, Inter, sans-serif;
}
.tab.on { color: var(--ink, #1c160e); font-weight: 600; }
.tab.on::after {
  content: "";
  position: absolute;
  left: 8px; right: 8px; bottom: -1px;
  height: 1.5px;
  background: #1c160e;
  border-radius: 0;
}

.content { flex: 1; overflow: hidden; position: relative; background: #fffbf5; }
.content-scroll { padding: 10px 16px 6px; height: 100%; }

.card { margin-bottom: 8px; }
.cover {
  height: 160px;
  border-radius: 16px;
  position: relative;
  overflow: hidden;
  background-size: cover;
  background-position: center;
  box-shadow: 0 8px 20px rgba(40,36,30,0.10);
}

.cover.cafe { background-image: url(var(--img-card-start-jpg)); background-position: center; }
.cover.meal { background-image: url(var(--img-card-tracker-jpg)); background-position: center; }
.cover.setup { background-image: url(var(--img-card-calls-jpg)); background-position: center; }
.cover.community { background-image: url(var(--img-card-community-jpg)); background-position: center; }

.cover .scrim {
  position: absolute; inset: 0;
  background: linear-gradient(180deg, rgba(0,0,0,0.0) 50%, rgba(20,12,4,0.52) 100%);
}
.cover.meal .scrim {
  background: linear-gradient(180deg, rgba(0,0,0,0.0) 40%, rgba(20,12,4,0.52) 100%);
}
.cover.cafe .scrim {
  background: linear-gradient(180deg, rgba(0,0,0,0.0) 52%, rgba(20,12,4,0.50) 100%);
}
.cover.community .scrim {
  background: linear-gradient(180deg, rgba(0,0,0,0.0) 68%, rgba(20,12,4,0.42) 100%);
}

/* Locked cards: dim + slight desaturate; type stays above the veil */
.card.locked .cover .scrim {
  background: linear-gradient(180deg, rgba(16,14,12,0.22) 28%, rgba(10,9,8,0.62) 100%);
  -webkit-backdrop-filter: grayscale(48%) brightness(0.70);
  backdrop-filter: grayscale(48%) brightness(0.70);
  z-index: 1;
}

.cover .sp {
  position: absolute;
  right: 10px; top: 10px;
  width: 36px; height: 28px;
  background: url(var(--img-sprinter-white-png)) center / contain no-repeat;
  opacity: 0.9;
  filter: drop-shadow(0 1px 4px rgba(0,0,0,0.35));
  z-index: 2;
}
.cover-title {
  position: absolute;
  left: 14px; bottom: 12px;
  font-family: Newsreader, serif;
  font-size: 28px;
  font-weight: 500;
  font-style: italic;
  font-optical-sizing: auto;
  letter-spacing: -0.4px;
  line-height: 1;
  color: #fff;
  text-shadow: 0 2px 10px rgba(0,0,0,0.35);
  z-index: 2;
}
.cover-tag {
  position: absolute;
  left: 14px; top: 12px;
  font-size: 10px;
  font-weight: 650;
  letter-spacing: 1.1px;
  text-transform: uppercase;
  color: #fff;
  background: rgba(255,255,255,0.18);
  backdrop-filter: blur(8px);
  -webkit-backdrop-filter: blur(8px);
  padding: 3px 8px;
  border-radius: 100px;
  z-index: 2;
  font-family: Outfit, Inter, sans-serif;
}

.prog { margin-top: 8px; display: flex; align-items: center; gap: 8px; min-height: 12px; }
.bar {
  flex: 1;
  height: 1px;
  background: #b8b2a8;
  border-radius: 0;
  overflow: visible;
}
.bar > i { display: block; height: 1px; width: 100%; background: #1c160e; border-radius: 0; }
.prog-lab { font-size: 11px; color: #1c160e; font-weight: 650; white-space: nowrap; font-family: Outfit, Inter, sans-serif; }
.prog.locked { opacity: 1; }
.prog.locked .prog-lab { display: none; }
.prog.locked .bar { background: #b8b2a8; }

.lock-pill {
  display: inline-flex; align-items: center; gap: 6px;
  margin-top: 8px;
  font-size: 11.5px; font-weight: 650;
  color: #f4f1ec;
  background: #2a2724;
  padding: 5px 10px;
  border-radius: 100px;
  font-family: Outfit, Inter, sans-serif;
}
.cover .lock-pill {
  position: absolute;
  left: 14px;
  bottom: 10px;
  margin-top: 0;
  z-index: 3;
  box-shadow: 0 2px 8px rgba(0,0,0,0.28);
}
.card.locked .cover-title { bottom: 42px; }

.tabbar {
  height: 74px;
  flex-shrink: 0;
  display: flex;
  align-items: flex-start;
  justify-content: space-around;
  padding: 6px 8px 0;
  position: relative;
  z-index: 5;
  background: #fffbf5;
  border-top: 1px solid #e8e4de;
}
.tabbar-item {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 2px;
  color: var(--muted, #8a8580);
  font-size: 10px;
  font-weight: 500;
  letter-spacing: -0.1px;
  font-family: Inter, sans-serif;
}
.tabbar-item.on { color: var(--ink, #1c160e); }
.home-ind {
  position: absolute;
  left: 50%;
  bottom: 8px;
  transform: translateX(-50%);
  width: 134px;
  height: 5px;
  background: var(--ink, #1c160e);
  opacity: 0.85;
  border-radius: 100px;
}

/* 3-card first screen */
.s8t .header { height: 64px; }
.s8t .tabs { height: 40px; }
.s8t .tabbar { height: 74px; }
.s8t .content-scroll { padding: 16px 16px 14px; }
.s8t .card { margin-bottom: 16px; }
.s8t .card:last-child { margin-bottom: 0; }
.s8t .cover { height: 160px; border-radius: 16px; }
.s8t .cover-title { font-size: 28px; bottom: 12px; }
.s8t .card.locked .cover-title { bottom: 42px; }

/* Scrolled screen */
.s8s .header { height: 64px; }
.s8s .tabs { height: 40px; }
.s8s .tabbar { height: 74px; }
.s8s .content { overflow: hidden; }
.s8s .content-scroll { padding: 0 16px 14px; }
.s8s .card-peek {
  margin: 0 0 16px;
  margin-top: -84px;
}
.s8s .card-peek .cover { height: 160px; border-radius: 16px; }
.s8s .card-peek .cover-title { font-size: 28px; bottom: 42px; }
.s8s .card.community-card { margin-bottom: 14px; }
.s8s .cover.community { height: 220px; border-radius: 16px; }
.s8s .cover.community .cover-title { font-size: 28px; bottom: 14px; }
.s8s .card.locked .cover.community .cover-title { bottom: 42px; }
.s8s .comm-sub {
  padding: 10px 4px 0;
  font-size: 13px;
  color: #8a7a68;
  font-weight: 400;
  letter-spacing: -0.1px;
  line-height: 1.35;
  font-family: Outfit, Inter, sans-serif;
}

.qa {
  margin-top: 4px;
  background: #fff;
  border: 1px solid #e8e4de;
  border-radius: 16px;
  overflow: hidden;
  box-shadow: 0 4px 14px rgba(40,36,30,0.06);
}
.qa-head {
  padding: 12px 14px 10px;
  font-size: 15.5px;
  font-weight: 650;
  letter-spacing: -0.3px;
  color: #1c160e;
  font-family: Outfit, Inter, sans-serif;
}
.qa-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  padding: 12px 14px;
  border-top: 1px solid #e8e4de;
  font-size: 13.5px;
  font-weight: 450;
  color: #3a3228;
  letter-spacing: -0.15px;
  font-family: Outfit, Inter, sans-serif;
}
.qa-row .chev {
  color: #8a8580;
  font-size: 18px;
  line-height: 1;
  font-weight: 400;
}

/* Shared header height with approved classroom */
.s8t .header, .stab .header, .smod .header { height: 64px; }
.stab .tabs, .s8t .tabs { height: 40px; }
.s8t .tabbar, .stab .tabbar, .smod .tabbar { height: 74px; }
.stab .content-scroll { padding: 14px 16px 16px; }

/* Inner module header: back + Newsreader title */
.header .page-title {
  flex: 1;
  font-family: Newsreader, serif;
  font-style: italic;
  font-weight: 500;
  font-optical-sizing: auto;
  font-size: 22px;
  letter-spacing: -0.4px;
  color: #1c160e;
  margin-left: 6px;
  line-height: 1.1;
}
.smod .tabs { display: none; }
.smod .content-scroll { padding: 12px 16px 18px; }

.lede {
  font-family: Newsreader, serif;
  font-style: italic;
  font-weight: 400;
  font-size: 16.5px;
  line-height: 1.35;
  letter-spacing: -0.2px;
  color: #3a3228;
  margin-bottom: 14px;
}
.note {
  font-size: 12.5px;
  color: #8a7a68;
  line-height: 1.4;
  margin-top: 8px;
}

/* ——— Community feed ——— */
.feed-pin {
  background: #fff;
  border: 1px solid #e8e4de;
  border-radius: 16px;
  padding: 12px 14px 13px;
  margin-bottom: 12px;
  box-shadow: 0 4px 14px rgba(40,36,30,0.05);
}
.feed-pin .pin-lab {
  font-size: 10px;
  font-weight: 650;
  letter-spacing: 1.1px;
  text-transform: uppercase;
  color: #8a8580;
  margin-bottom: 6px;
}
.feed-pin p, .post p {
  font-size: 14.5px;
  line-height: 1.4;
  color: #1c160e;
  letter-spacing: -0.15px;
  font-weight: 400;
}
.post {
  padding: 12px 4px 13px;
  border-top: 1px solid #e8e4de;
}
.post:first-of-type { border-top: none; padding-top: 2px; }
.post-meta {
  display: flex;
  align-items: center;
  gap: 8px;
  margin-bottom: 6px;
}
.av {
  width: 28px; height: 28px;
  border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  font-size: 10px; font-weight: 650;
  letter-spacing: 0.2px;
  color: #fffbf5;
  background: #2a2724;
  flex-shrink: 0;
  font-family: Outfit, Inter, sans-serif;
}
.av.a { background: #3a3530; }
.av.b { background: #5a534c; }
.av.c { background: #2f3a34; }
.av.d { background: #4a433c; }
.av.e { background: #6a635c; }
.av.leon { background: #1c160e; }
.post-who { font-size: 13.5px; font-weight: 650; letter-spacing: -0.2px; }
.post-kind { font-size: 11.5px; color: #8a8580; margin-top: 1px; }
.sample {
  font-size: 9.5px;
  font-weight: 650;
  letter-spacing: 0.9px;
  text-transform: uppercase;
  color: #9a9288;
  border: 1px solid #e8e4de;
  border-radius: 100px;
  padding: 1px 6px;
  margin-left: auto;
}

/* ——— Calendar ——— */
.cal-lede {
  font-size: 13px;
  color: #6b655c;
  line-height: 1.4;
  margin-bottom: 14px;
}
.week {
  display: grid;
  grid-template-columns: repeat(7, 1fr);
  gap: 4px;
  margin-bottom: 16px;
}
.day {
  text-align: center;
  padding: 8px 0 9px;
  border-radius: 12px;
}
.day .dow {
  font-size: 9.5px;
  font-weight: 650;
  letter-spacing: 0.8px;
  text-transform: uppercase;
  color: #8a8580;
}
.day .num {
  font-size: 15px;
  font-weight: 600;
  margin-top: 3px;
  color: #1c160e;
}
.day.on { background: #1c160e; }
.day.on .dow, .day.on .num { color: #fffbf5; }
.day .dot {
  width: 4px; height: 4px;
  border-radius: 50%;
  background: #1c160e;
  margin: 5px auto 0;
}
.day.on .dot { background: #fffbf5; }
.day .dot.empty { background: #f4f1eb; }
.slot {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  padding: 12px 2px;
  border-top: 1px solid #e8e4de;
}
.slot:first-of-type { border-top: none; }
.slot-when { font-size: 14.5px; font-weight: 550; letter-spacing: -0.2px; }
.slot-sub { font-size: 12px; color: #8a7a68; margin-top: 2px; }
.pill {
  font-size: 10.5px;
  font-weight: 650;
  letter-spacing: 0.6px;
  text-transform: uppercase;
  padding: 4px 8px;
  border-radius: 100px;
  color: #1c160e;
  background: #ece8e2;
  flex-shrink: 0;
}
.pill.open { background: #1c160e; color: #fffbf5; }
.pill.booked { background: #ece8e2; color: #6b6560; }

/* ——— Members ——— */
.member {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 11px 2px;
  border-top: 1px solid #e8e4de;
}
.member:first-of-type { border-top: none; }
.member .av { width: 36px; height: 36px; font-size: 12px; }
.member-name { font-size: 15px; font-weight: 550; letter-spacing: -0.2px; }
.member-sub { font-size: 12px; color: #8a7a68; margin-top: 1px; }
.lvl {
  margin-left: auto;
  font-size: 10.5px;
  font-weight: 650;
  letter-spacing: 0.5px;
  text-transform: uppercase;
  color: #5a534c;
  background: #ece8e2;
  padding: 4px 8px;
  border-radius: 100px;
  flex-shrink: 0;
}
.lvl.one { background: #1c160e; color: #fffbf5; }

/* ——— Buttons ——— */
.btn {
  display: flex;
  align-items: center;
  justify-content: center;
  width: 100%;
  min-height: 44px;
  padding: 11px 16px;
  border-radius: 14px;
  font-family: Outfit, Inter, sans-serif;
  font-size: 14.5px;
  font-weight: 650;
  letter-spacing: -0.2px;
  border: none;
  cursor: pointer;
  text-decoration: none;
  color: #fffbf5;
  background: #1c160e;
}
.btn.ghost {
  background: #f4f1eb;
  color: #1c160e;
  border: 1px solid #c8c2ba;
}
.btn.big {
  min-height: 52px;
  font-size: 16px;
  letter-spacing: -0.3px;
  margin: 4px 0 12px;
}
.btn[disabled], .btn.disabled {
  background: #ece8e2;
  color: #6b6560;
  cursor: default;
}

/* ——— Start here steps ——— */
.steps { margin-top: 2px; }
.step {
  padding: 12px 0 14px;
  border-top: 1px solid #e8e4de;
}
.step:first-child { border-top: none; padding-top: 2px; }
.step-num {
  font-size: 10px;
  font-weight: 650;
  letter-spacing: 1.1px;
  text-transform: uppercase;
  color: #8a8580;
  margin-bottom: 4px;
}
.step h3 {
  font-family: Newsreader, serif;
  font-style: italic;
  font-weight: 500;
  font-size: 20px;
  letter-spacing: -0.3px;
  line-height: 1.15;
  margin-bottom: 6px;
}
.step p {
  font-size: 13px;
  line-height: 1.4;
  color: #5a534c;
}
.video-ph {
  margin-top: 10px;
  height: 112px;
  border-radius: 14px;
  background: #1c160e;
  color: #fffbf5;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 6px;
  position: relative;
  overflow: hidden;
}
.video-ph .play {
  width: 36px; height: 36px;
  border-radius: 50%;
  border: 1.5px solid #fffbf5;
  display: flex; align-items: center; justify-content: center;
  font-size: 13px;
  padding-left: 2px;
}
.video-ph .vl {
  font-size: 11px;
  font-weight: 650;
  letter-spacing: 0.8px;
  text-transform: uppercase;
  opacity: 0.85;
}
.step .btn { margin-top: 10px; }

/* ——— AI tracker / demo ——— */
.tracker {
  margin-top: 10px;
  padding-top: 10px;
  border-top: 1px solid #e8e4de;
}
.tracker h3 {
  font-family: Newsreader, serif;
  font-style: italic;
  font-weight: 500;
  font-size: 20px;
  letter-spacing: -0.3px;
  margin-bottom: 4px;
}
.fields { margin-top: 10px; }
.field {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  padding: 8px 0;
  border-top: 1px solid #e8e4de;
}
.field:first-of-type { border-top: none; }
.field label { font-size: 13.5px; font-weight: 500; color: #1c160e; }
.field input[type="number"], .field input[type="text"] {
  width: 92px;
  height: 32px;
  border: none;
  border-bottom: 1px solid #1c160e;
  background: #f4f1eb;
  font-family: Outfit, Inter, sans-serif;
  font-size: 14.5px;
  font-weight: 550;
  color: #1c160e;
  text-align: right;
  outline: none;
}
.yn {
  display: flex;
  gap: 6px;
}
.yn button {
  min-width: 44px;
  height: 28px;

function toast(msg) {
  const el = document.getElementById("toast");
  el.textContent = msg;
  el.classList.add("show");
  clearTimeout(toast._t);
  toast._t = setTimeout(() => el.classList.remove("show"), 1800);
}

function openArtifact() {
  if (ARTIFACT_URL) {
    window.open(ARTIFACT_URL, "_blank", "noopener");
  } else {
    toast("Artifact link coming");

}

function artifactBtn(big) {

function visibleTabs() {
  return adminView ? ALL_TABS : ALL_TABS.slice(0, 3);
}

function tabsBar(view) {
  const show = TOP_VIEWS.includes(view);
  if (!show) return { html: "", show: false, admin: false };
  const onName = Object.keys(TAB_VIEWS).find(k => TAB_VIEWS[k] === view);
  const html = visibleTabs().map(n =>
    '<button class="tab' + (n === onName ? ' on' : '') + '" type="button" data-tab="' + n + '">' + n + '</button>'
  ).join("");
  return { html: html, show: true, admin: adminView && view === "members" };
}

  return '<div class="cover' + extra + '" style="background-image:url(\'' + imgSrc(file) + '\')"><div class="scrim"></div><div class="sp"></div>' +
    '<div class="cover-tag">' + tag + '</div><div class="cover-title">' + title + '</div>' + lockHtml + '</div>';
}
function hero(file, title, tag) {

function setRole(isAdmin) {
  adminView = !!isAdmin;
  document.getElementById("view-member").classList.toggle("on", !adminView);
  document.getElementById("view-admin").classList.toggle("on", adminView);
  document.getElementById("menu-member").classList.toggle("on", !adminView);
  document.getElementById("menu-admin").classList.toggle("on", adminView);
  if (!adminView && current === "members") current = "classroom";
  go(current);
}

function go(view) {
  current = view;
  if (TOP_VIEWS.includes(view)) lastTab = view;
  document.getElementById("header").outerHTML = '<div class="header" id="header">' + header(view) + '</div>';
  const tb = tabsBar(view);
  const tabsEl = document.getElementById("tabs");
  tabsEl.innerHTML = tb.html;
  tabsEl.classList.toggle("hidden", !tb.show);
  document.getElementById("admin-bar").classList.toggle("hidden", !tb.admin);
  const main = document.getElementById("main");
  main.innerHTML = views(view);
  main.parentElement.scrollTop = 0;
  document.getElementById("more-menu").classList.remove("open");
  if (view === "tracker") bindTracker();
  document.body.setAttribute("data-view", view);
  document.body.setAttribute("data-role", adminView ? "admin" : "member");
}

function loadEntries() {
  try { return JSON.parse(localStorage.getItem(TRACK_KEY) || "[]"); }
  catch (e) { return []; }
}

function bindTracker() {
  formState = { training: "No", protein: "No" };
  document.getElementById("btn-save").addEventListener("click", saveCheckin);
  renderTracker();
}

function saveCheckin() {
  const weight = parseFloat(document.getElementById("f-weight").value);
  const steps = parseInt(document.getElementById("f-steps").value, 10);
  const sleep = parseFloat(document.getElementById("f-sleep").value);
  if (!(weight > 0) || !(steps >= 0) || !(sleep >= 0)) {
    toast("Add weight, steps and sleep first.");
    return;
  }
  const all = loadEntries();
  const today = new Date().toISOString().slice(0, 10);
  const entry = { date: today, weight: weight, steps: steps, training: formState.training, protein: formState.protein, sleep: sleep };
  const idx = all.findIndex(e => e.date === today);
  if (idx >= 0) all[idx] = entry; else all.push(entry);
  localStorage.setItem(TRACK_KEY, JSON.stringify(all));
  toast("Check-in saved.");
  renderTracker();
}

function renderTracker() {
  const user = loadEntries();
  const usingSample = user.length === 0;
  const all = usingSample ? SAMPLE_LOG : user;
  const chart = document.getElementById("weight-chart");
  const bars = document.getElementById("steps-bars");
  const list = document.getElementById("entries");
  const title = document.querySelector("#demo-tracker h3");
  if (title) title.textContent = usingSample ? "Demo tracker · Sample" : "Demo tracker";

  const weights = all.map(e => e.weight);
  if (!weights.length) {
    chart.innerHTML = '<div class="chart-empty">Log a few days to see the weight trend.</div>';
  } else {
    const w = 320, h = 72, pad = 8;
    const mn = Math.min.apply(null, weights), mx = Math.max.apply(null, weights);
    const span = Math.max(mx - mn, 2);
    const pts = weights.map((v, i) => {
      const x = pad + (weights.length === 1 ? (w - 2 * pad) / 2 : i * (w - 2 * pad) / (weights.length - 1));
      const y = h - pad - (v - mn) / span * (h - 2 * pad);
      return [x, y];
    });
    const d = pts.map((p, i) => (i ? "L" : "M") + p[0].toFixed(1) + " " + p[1].toFixed(1)).join(" ");
    const dots = pts.map(p => '<circle cx="' + p[0].toFixed(1) + '" cy="' + p[1].toFixed(1) + '" r="2.2" fill="#1c160e" />').join("");
    chart.innerHTML = '<div class="chart-wrap"><svg viewBox="0 0 ' + w + ' ' + h + '" preserveAspectRatio="none">' +
      '<line x1="' + pad + '" y1="' + (h-pad) + '" x2="' + (w-pad) + '" y2="' + (h-pad) + '" stroke="#e8e4de" stroke-width="1" />' +
      '<path d="' + d + '" fill="none" stroke="#1c160e" stroke-width="1.25" />' + dots + '</svg></div>';
  }

  const steps = all.map(e => e.steps);
  if (!steps.length) {
    bars.innerHTML = "";
  } else {
    const mx = Math.max.apply(null, steps) || 1;
    const labels = usingSample ? ["M","T","W","T","F"] : all.map(e => e.date.slice(8));
    const trackH = 48;
    bars.innerHTML = '<div class="steps-bars">' + steps.map((v, i) => {
      const px = Math.max(6, Math.round(trackH * v / mx));
      return '<div class="col"><div class="track" style="height:' + trackH + 'px"><i style="height:' + px + 'px"></i></div><span>' + (labels[i] || "") + '</span></div>';
    }).join("") + '</div>';
  }

  if (list) {
    if (usingSample) list.textContent = "Sample week shown. Save a check-in to start your log.";
    else list.innerHTML = all.slice(-5).reverse().map(e =>
      e.date + " · " + e.weight + " kg · " + e.steps + " steps · train " + e.training + " · protein " + e.protein + " · " + e.sleep + " h"
    ).join("<br>");
  }
}

document.getElementById("app").addEventListener("click", (e) => {
  const yn = e.target.closest("[data-yn]");
  if (yn) {
    formState[yn.getAttribute("data-yn")] = yn.getAttribute("data-val");
    const group = yn.parentElement;
    group.querySelectorAll("button").forEach(b => b.classList.toggle("on", b === yn));
    return;
  }
  const tab = e.target.closest("[data-tab]");
  if (tab) { go(TAB_VIEWS[tab.getAttribute("data-tab")]); return; }
  const goBtn = e.target.closest("[data-go]");
  if (goBtn) { go(goBtn.getAttribute("data-go")); return; }
  const act = e.target.closest("[data-act]");
  if (!act) return;
  const a = act.getAttribute("data-act");
  if (a === "back") {
    if (TOP_VIEWS.includes(current)) return;
    go(lastTab);
  } else if (a === "artifact") {
    openArtifact();
  } else if (a === "book") {
    toast("Booking link to come.");
  } else if (a === "video") {
    toast("Welcome video to come.");
  } else if (a === "share") {
    toast("Share to come.");
  } else if (a === "more") {
    document.getElementById("more-menu").classList.toggle("open");
  } else if (a === "qa") {
    const item = act.closest(".qa-item");
    if (item) item.classList.toggle("open");
  }
});

document.getElementById("view-member").addEventListener("click", () => setRole(false));
document.getElementById("view-admin").addEventListener("click", () => setRole(true));
document.getElementById("menu-member").addEventListener("click", () => setRole(false));
document.getElementById("menu-admin").addEventListener("click", () => setRole(true));

go("classroom");
</script>
